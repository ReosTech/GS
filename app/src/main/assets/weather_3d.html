<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Smooth Fixed 3D Weather Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: pan-y;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: pan-y;
    }
  </style>
  <script src="file:///android_asset/three.min.js"></script>
</head>
<body>
  <div id="webgl-container"></div>
  <script>
    // --- 1. Three.js Lightweight Scene Setup (Calibrated for zero lag & natural colors) ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / (window.innerHeight || 1), 0.1, 80);
    const FIXED_CAM_POS = new THREE.Vector3(0, 1.35, 8.6);
    camera.position.copy(FIXED_CAM_POS);
    camera.lookAt(0, 0.45, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: true,
      powerPreference: "low-power"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.0, 2.0));
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    // --- 2. Soft, Natural Balanced Lighting (No harsh blown-out colors) ---
    const hemiLight = new THREE.HemisphereLight(0xe2e8f0, 0x475569, 0.48);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.62);
    dirLight.position.set(5, 9, 4.5);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambientLight);

    const lightningLight = new THREE.PointLight(0xa5f3fc, 0, 18);
    lightningLight.position.set(0, 3.5, 0);
    scene.add(lightningLight);

    // --- 3. Optimized Low-Poly Natural Weather Biome (MeshLambertMaterial for soft matte finish) ---
    const rootGroup = new THREE.Group();
    scene.add(rootGroup);

    // A. Floating Biome Platter
    const islandGroup = new THREE.Group();
    rootGroup.add(islandGroup);

    const grassGeo = new THREE.CylinderGeometry(3.6, 3.4, 0.65, 24);
    const grassMat = new THREE.MeshLambertMaterial({
      color: 0x3b6e44
    });
    const grassMesh = new THREE.Mesh(grassGeo, grassMat);
    grassMesh.position.y = -0.3;
    islandGroup.add(grassMesh);

    const earthGeo = new THREE.CylinderGeometry(3.4, 0.4, 2.2, 18);
    const earthMat = new THREE.MeshLambertMaterial({
      color: 0x475569
    });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    earthMesh.position.y = -1.6;
    islandGroup.add(earthMesh);

    // Subtle decorative trees
    const allTrees = [];
    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.16, 0.7, 8);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3d24 });
    const foliageMat = new THREE.MeshLambertMaterial({ color: 0x1f4e2b });

    function createSmoothTree(x, z, scale = 1) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.scale.set(scale, scale, scale);
      trunk.position.y = 0.35 * scale;
      tree.add(trunk);

      for (let i = 0; i < 3; i++) {
        const tierGeo = new THREE.ConeGeometry((0.85 - i * 0.2) * scale, (0.75 - i * 0.1) * scale, 12);
        const tier = new THREE.Mesh(tierGeo, foliageMat);
        tier.position.y = (0.65 + i * 0.4) * scale;
        tree.add(tier);
      }
      tree.position.set(x, 0.02, z);
      allTrees.push({ group: tree, baseScale: scale });
      return tree;
    }

    islandGroup.add(createSmoothTree(-1.3, 0.6, 1.1));
    islandGroup.add(createSmoothTree(-1.9, -0.5, 0.85));
    islandGroup.add(createSmoothTree(1.6, 0.8, 1.05));
    islandGroup.add(createSmoothTree(2.0, -0.4, 0.8));
    islandGroup.add(createSmoothTree(0.1, -1.4, 1.2));

    // River pebbles
    const pMat = new THREE.MeshLambertMaterial({ color: 0x64748b });
    function createSmoothPebble(x, z, radius) {
      const pGeo = new THREE.SphereGeometry(radius, 12, 12);
      pGeo.scale(1.2, 0.7, 1.0);
      const p = new THREE.Mesh(pGeo, pMat);
      p.position.set(x, radius * 0.5, z);
      return p;
    }
    islandGroup.add(createSmoothPebble(0.6, 1.2, 0.28));
    islandGroup.add(createSmoothPebble(-0.7, 1.3, 0.22));

    // B. Gentle Natural Sun (Soft matte gold, non-burning)
    const sunGroup = new THREE.Group();
    sunGroup.position.set(2.5, 2.4, -1.0);
    rootGroup.add(sunGroup);

    const sunCoreGeo = new THREE.SphereGeometry(1.0, 16, 16);
    const sunCoreMat = new THREE.MeshLambertMaterial({
      color: 0xfbbf24,
      emissive: 0xd97706,
      emissiveIntensity: 0.12
    });
    const sunCore = new THREE.Mesh(sunCoreGeo, sunCoreMat);
    sunGroup.add(sunCore);

    const coronaGroup = new THREE.Group();
    sunGroup.add(coronaGroup);

    const rayGeo = new THREE.ConeGeometry(0.16, 0.65, 10);
    const rayMat = new THREE.MeshLambertMaterial({
      color: 0xfde047,
      emissive: 0xd97706,
      emissiveIntensity: 0.08
    });
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const ray = new THREE.Mesh(rayGeo, rayMat);
      ray.position.set(Math.cos(angle) * 1.35, Math.sin(angle) * 1.35, 0);
      ray.rotation.z = angle - Math.PI / 2;
      coronaGroup.add(ray);
    }

    const sunHaloMat = new THREE.MeshBasicMaterial({
      color: 0xfef08a,
      transparent: true,
      opacity: 0.12,
      side: THREE.BackSide
    });
    const sunHalo = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), sunHaloMat);
    sunGroup.add(sunHalo);

    // C. Lunar Mode (Night)
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-2.4, 2.5, -1.2);
    moonGroup.visible = false;
    rootGroup.add(moonGroup);

    const moonCoreMat = new THREE.MeshLambertMaterial({
      color: 0xcfd8dc,
      emissive: 0x90a4ae,
      emissiveIntensity: 0.12
    });
    const moonCore = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), moonCoreMat);
    moonGroup.add(moonCore);

    const moonHaloMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.14,
      side: THREE.BackSide
    });
    const moonHalo = new THREE.Mesh(new THREE.SphereGeometry(1.25, 16, 16), moonHaloMat);
    moonGroup.add(moonHalo);

    // D. Soft Volumetric Clouds (12x12 segment puffs for peak performance)
    function createSmoothCloud(scale = 1, isDark = false) {
      const cloud = new THREE.Group();
      const cloudMat = new THREE.MeshLambertMaterial({
        color: isDark ? 0x334155 : 0xf8fafc
      });
      const puffs = [
        [0, 0, 0, 0.80],
        [0.65, 0.08, 0, 0.62],
        [-0.65, 0.04, 0, 0.58],
        [0.28, 0.38, 0.1, 0.54],
        [-0.28, 0.34, -0.1, 0.50]
      ];
      puffs.forEach(([px, py, pz, pr]) => {
        const pGeo = new THREE.SphereGeometry(pr * scale, 12, 12);
        const puff = new THREE.Mesh(pGeo, cloudMat);
        puff.position.set(px * scale, py * scale, pz * scale);
        cloud.add(puff);
      });
      return cloud;
    }

    const cloudsGroup = new THREE.Group();
    rootGroup.add(cloudsGroup);

    const cloud1 = createSmoothCloud(1.15, false);
    cloud1.position.set(-1.7, 2.0, 0.8);
    cloudsGroup.add(cloud1);

    const cloud2 = createSmoothCloud(0.92, false);
    cloud2.position.set(1.8, 1.7, -0.6);
    cloudsGroup.add(cloud2);

    const cloud3 = createSmoothCloud(1.25, false);
    cloud3.position.set(0.1, 2.5, -1.3);
    cloudsGroup.add(cloud3);

    // E. Lightweight Particle Systems (Rain & Snow)
    const rainCount = 45;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPositions[i] = (Math.random() - 0.5) * 8.5;
      rainPositions[i + 1] = Math.random() * 8.0;
      rainPositions[i + 2] = (Math.random() - 0.5) * 8.5;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.PointsMaterial({
      color: 0x60a5fa,
      size: 0.10,
      transparent: true,
      opacity: 0.65
    });
    const rainSystem = new THREE.Points(rainGeo, rainMat);
    rainSystem.visible = false;
    scene.add(rainSystem);

    const snowCount = 40;
    const snowGeo = new THREE.BufferGeometry();
    const snowPositions = new Float32Array(snowCount * 3);
    for (let i = 0; i < snowCount * 3; i += 3) {
      snowPositions[i] = (Math.random() - 0.5) * 8.5;
      snowPositions[i + 1] = Math.random() * 8.0;
      snowPositions[i + 2] = (Math.random() - 0.5) * 8.5;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
    const snowMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.14,
      transparent: true,
      opacity: 0.75
    });
    const snowSystem = new THREE.Points(snowGeo, snowMat);
    snowSystem.visible = false;
    scene.add(snowSystem);

    // F. Starfield for Night Mode
    const starCount = 80;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 12.0;
      starPositions[i + 1] = Math.random() * 6.0 + 0.5;
      starPositions[i + 2] = -2.5 - Math.random() * 4.0;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xc7d2fe,
      size: 0.10,
      transparent: true,
      opacity: 0.60
    });
    const starSystem = new THREE.Points(starGeo, starMat);
    starSystem.visible = false;
    scene.add(starSystem);

    // --- 4. Interactive Touch Tilt Parallax ---
    let targetTiltX = 0;
    let targetTiltY = 0;
    let currentTiltX = 0;
    let currentTiltY = 0;
    let isTouching = false;
    let startTouchX = 0;
    let startTouchY = 0;

    container.addEventListener('pointerdown', (e) => {
      isTouching = true;
      startTouchX = e.clientX;
      startTouchY = e.clientY;
    }, { passive: true });

    window.addEventListener('pointermove', (e) => {
      if (!isTouching) return;
      const dx = (e.clientX - startTouchX) / window.innerWidth;
      const dy = (e.clientY - startTouchY) / window.innerHeight;
      targetTiltY = dx * 0.40;
      targetTiltX = dy * 0.30;
    }, { passive: true });

    window.addEventListener('pointerup', () => {
      isTouching = false;
      targetTiltX = 0;
      targetTiltY = 0;
    });

    window.addEventListener('pointercancel', () => {
      isTouching = false;
      targetTiltX = 0;
      targetTiltY = 0;
    });

    function triggerLightning() {
      lightningLight.intensity = 2.4;
      setTimeout(() => { lightningLight.intensity = 0.2; }, 60);
      setTimeout(() => { lightningLight.intensity = 1.8; }, 120);
      setTimeout(() => { lightningLight.intensity = 0; }, 180);
    }

    // --- 5. Weather Presets (Soft, Natural, Non-Oversaturated Tones) ---
    let currentMode = 'clear';
    const presets = {
      clear: {
        hemiSky: 0xe2e8f0,
        hemiGround: 0x475569,
        dirColor: 0xfffbeb,
        dirIntensity: 0.62,
        sun: true,
        moon: false,
        cloudDark: false,
        rain: false,
        snow: false,
        grassColor: 0x3b6e44
      },
      clouds: {
        hemiSky: 0xdde3ea,
        hemiGround: 0x526071,
        dirColor: 0xfff7ed,
        dirIntensity: 0.54,
        sun: true,
        moon: false,
        cloudDark: false,
        rain: false,
        snow: false,
        grassColor: 0x3b6e44
      },
      rain: {
        hemiSky: 0x8294a8,
        hemiGround: 0x2b3848,
        dirColor: 0x93c5fd,
        dirIntensity: 0.45,
        sun: false,
        moon: false,
        cloudDark: true,
        rain: true,
        snow: false,
        grassColor: 0x244e2f
      },
      storm: {
        hemiSky: 0x475569,
        hemiGround: 0x1e293b,
        dirColor: 0x818cf8,
        dirIntensity: 0.32,
        sun: false,
        moon: false,
        cloudDark: true,
        rain: true,
        snow: false,
        grassColor: 0x1a3d24
      },
      snow: {
        hemiSky: 0xe8edf2,
        hemiGround: 0x526071,
        dirColor: 0xf8fafc,
        dirIntensity: 0.65,
        sun: false,
        moon: false,
        cloudDark: false,
        rain: false,
        snow: true,
        grassColor: 0xcfd8dc
      },
      night: {
        hemiSky: 0x0f172a,
        hemiGround: 0x020617,
        dirColor: 0x7dd3fc,
        dirIntensity: 0.55,
        sun: false,
        moon: true,
        stars: true,
        cloudsVisible: true,
        cloudDark: true,
        rain: false,
        snow: false,
        grassColor: 0x1a3321
      },
      night_clear: {
        hemiSky: 0x0b1120,
        hemiGround: 0x020617,
        dirColor: 0x93c5fd,
        dirIntensity: 0.60,
        sun: false,
        moon: true,
        stars: true,
        cloudsVisible: false,
        cloudDark: false,
        rain: false,
        snow: false,
        grassColor: 0x162c1d
      },
      night_clouds: {
        hemiSky: 0x1e293b,
        hemiGround: 0x0f172a,
        dirColor: 0x7dd3fc,
        dirIntensity: 0.50,
        sun: false,
        moon: true,
        stars: true,
        cloudsVisible: true,
        cloudDark: true,
        rain: false,
        snow: false,
        grassColor: 0x162c1d
      },
      night_rain: {
        hemiSky: 0x0f172a,
        hemiGround: 0x020617,
        dirColor: 0x60a5fa,
        dirIntensity: 0.42,
        sun: false,
        moon: true,
        stars: false,
        cloudsVisible: true,
        cloudDark: true,
        rain: true,
        snow: false,
        grassColor: 0x112316
      },
      night_storm: {
        hemiSky: 0x111827,
        hemiGround: 0x030712,
        dirColor: 0x818cf8,
        dirIntensity: 0.30,
        sun: false,
        moon: false,
        stars: false,
        cloudsVisible: true,
        cloudDark: true,
        rain: true,
        snow: false,
        grassColor: 0x0e1b12
      },
      night_snow: {
        hemiSky: 0x1e1b4b,
        hemiGround: 0x0f172a,
        dirColor: 0xa5b4fc,
        dirIntensity: 0.55,
        sun: false,
        moon: true,
        stars: true,
        cloudsVisible: true,
        cloudDark: false,
        rain: false,
        snow: true,
        grassColor: 0x2b3848
      }
    };

    function applyPreset(name) {
      currentMode = name;
      const p = presets[name] || presets.clear;
      hemiLight.color.setHex(p.hemiSky);
      hemiLight.groundColor.setHex(p.hemiGround);
      dirLight.color.setHex(p.dirColor);
      dirLight.intensity = p.dirIntensity;

      sunGroup.visible = p.sun;
      moonGroup.visible = p.moon;
      starSystem.visible = p.stars || false;

      grassMat.color.setHex(p.grassColor);
      rainSystem.visible = p.rain;
      snowSystem.visible = p.snow;
      cloudsGroup.visible = p.cloudsVisible !== false;

      const cloudHex = p.cloudDark ? 0x334155 : 0xf8fafc;
      cloudsGroup.children.forEach(cGroup => {
        cGroup.children.forEach(mesh => {
          if (mesh.material) mesh.material.color.setHex(cloudHex);
        });
      });
    }

    let currentTemp = 20.0;
    let currentWind = 10.0;

    // External Bridge for Android Kotlin sync
    window.setWeatherFromAndroid = function(weatherCode, isDay, temp, windSpeed) {
      if (temp !== undefined && temp !== null && !isNaN(temp)) {
        currentTemp = parseFloat(temp);
      }
      if (windSpeed !== undefined && windSpeed !== null && !isNaN(windSpeed)) {
        currentWind = parseFloat(windSpeed);
      }

      if (!isDay) {
        if (weatherCode <= 1) {
          applyPreset('night_clear');
        } else if (weatherCode <= 3) {
          applyPreset('night_clouds');
        } else if ((weatherCode >= 51 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) {
          applyPreset('night_rain');
        } else if ((weatherCode >= 71 && weatherCode <= 77) || (weatherCode >= 85 && weatherCode <= 86)) {
          applyPreset('night_snow');
        } else if (weatherCode >= 95) {
          applyPreset('night_storm');
        } else {
          applyPreset('night_clouds');
        }
      } else {
        if (weatherCode <= 1) {
          applyPreset('clear');
        } else if (weatherCode <= 3) {
          applyPreset('clouds');
        } else if ((weatherCode >= 51 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) {
          applyPreset('rain');
        } else if ((weatherCode >= 71 && weatherCode <= 77) || (weatherCode >= 85 && weatherCode <= 86)) {
          applyPreset('snow');
        } else if (weatherCode >= 95) {
          applyPreset('storm');
        } else {
          applyPreset('clouds');
        }
      }
    };

    // --- 6. Throttled 30 FPS Animation Loop (Smooth visuals, 60% lower GPU & CPU) ---
    let isPaused = false;
    document.addEventListener("visibilitychange", () => {
      isPaused = document.hidden;
    });

    window.setRenderPaused = function(paused) {
      isPaused = !!paused;
    };

    let lastFrameTime = performance.now();
    let simTime = 0;
    let nextLightning = 4.0;

    function animate(currentTime) {
      requestAnimationFrame(animate);
      if (isPaused) return;

      const elapsedMs = currentTime - lastFrameTime;
      if (elapsedMs < 8) return;
      lastFrameTime = currentTime;

      const delta = Math.min(elapsedMs / 1000, 0.04);
      simTime += delta;

      // Smooth Spring Parallax
      currentTiltX += (targetTiltX - currentTiltX) * 0.12;
      currentTiltY += (targetTiltY - currentTiltY) * 0.12;

      rootGroup.rotation.y = currentTiltY + Math.sin(simTime * 0.3) * 0.04;
      rootGroup.rotation.x = currentTiltX + Math.cos(simTime * 0.35) * 0.025;
      islandGroup.position.y = Math.sin(simTime * 0.6) * 0.06;

      // Tree swaying
      const windFactor = Math.min(Math.max(currentWind, 3), 60);
      allTrees.forEach((t, i) => {
        const swaySpeed = 1.2 + (i % 3) * 0.35 + windFactor * 0.02;
        const swayAmount = 0.015 + windFactor * 0.0012;
        t.group.rotation.z = Math.sin(simTime * swaySpeed + i) * swayAmount;
      });

      // Sun & Moon gentle movement
      if (sunGroup.visible) {
        sunGroup.position.y = 2.4 + Math.sin(simTime * 0.9) * 0.07;
        coronaGroup.rotation.z = simTime * 0.25;
      }
      if (moonGroup.visible) {
        moonGroup.position.y = 2.5 + Math.sin(simTime * 0.7) * 0.06;
      }

      // Cloud floating
      const cloudSpeed = 0.25 + windFactor * 0.015;
      cloud1.position.x = -1.7 + Math.sin(simTime * (cloudSpeed * 1.1)) * 0.26;
      cloud2.position.x = 1.8 + Math.cos(simTime * (cloudSpeed * 1.2)) * 0.22;
      cloud3.position.z = -1.3 + Math.sin(simTime * (cloudSpeed * 0.9)) * 0.18;

      // Rain particles
      if (rainSystem.visible) {
        const positions = rainGeo.attributes.position.array;
        const rainSpeed = 12 + windFactor * 0.08;
        for (let i = 1; i < rainPositions.length; i += 3) {
          positions[i] -= rainSpeed * delta;
          positions[i - 1] += (windFactor * 0.01) * delta;
          if (positions[i] < -1.8) {
            positions[i] = 6.5;
            positions[i - 1] = (Math.random() - 0.5) * 8.5;
          }
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      // Snow particles
      if (snowSystem.visible) {
        const positions = snowGeo.attributes.position.array;
        for (let i = 0; i < snowPositions.length; i += 3) {
          positions[i] += Math.sin(simTime + i) * 0.008;
          positions[i + 1] -= (2.4 + windFactor * 0.015) * delta;
          if (positions[i + 1] < -1.8) positions[i + 1] = 6.5;
        }
        snowGeo.attributes.position.needsUpdate = true;
      }

      // Storm lightning
      if (currentMode === 'storm' || currentMode === 'night_storm') {
        nextLightning -= delta;
        if (nextLightning <= 0) {
          triggerLightning();
          nextLightning = 3.5 + Math.random() * 4.0;
        }
      }

      renderer.render(scene, camera);
    }

    function updateDimensions() {
      const w = container.clientWidth || window.innerWidth || 360;
      const h = container.clientHeight || window.innerHeight || 240;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', updateDimensions);
    setTimeout(updateDimensions, 60);

    applyPreset('clear');
    requestAnimationFrame(animate);
  </script>
</body>
</html>
